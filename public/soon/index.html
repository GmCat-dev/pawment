<!doctype html>
<html lang="en">
<head>

<title>Coming soon</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/soon/soon.css">

<body>
<main class="soon">
  <h1>Coming soon</h1>
  <p>Our crypto checkout opens shortly. Payments will go straight to our own wallet.</p>
  <p><button type="button" data-open-code>I have a preview code</button></p>
  <p class="small"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · Powered by Pawment (beta software, still under development)</p>
</main>
<dialog id="codeDlg" aria-labelledby="codeTitle">
  <button type="button" class="x" data-close aria-label="Close">×</button>
  <h2 id="codeTitle">Preview code</h2>
  <form id="codeForm">
    <label for="code">Code</label>
    <input id="code" autocomplete="off" spellcheck="false">
    <p id="codeMsg" role="alert"></p>
    <button type="submit">Open the preview</button>
  </form>
  <div id="unlocked" hidden><p>Unlocked on this device.</p><p><a href="/admin/">Go to the dashboard</a></p></div>
</dialog>
<script src="/soon/soon.js"></script>
</body>
